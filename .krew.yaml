apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: netobserv
spec:
  version: "{{ .TagName }}"
  homepage: https://github.com/netobserv/network-observability-cli
  shortDescription: "Lightweight flow, packet, and metrics visualization tool"
  description: |
    Deploys the NetObserv eBPF agent on your Kubernetes or OpenShift cluster
    to collect flows, packets, or metrics and streams data to a collector for
    analysis and visualization.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha "https://github.com/netobserv/network-observability-cli/releases/download/{{ .TagName }}/netobserv-cli-{{ .TagName }}-linux-amd64.tar.gz" .TagName}}
    bin: netobserv
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{addURIAndSha "https://github.com/netobserv/network-observability-cli/releases/download/{{ .TagName }}/netobserv-cli-{{ .TagName }}-linux-arm64.tar.gz" .TagName}}
    bin: netobserv
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://github.com/netobserv/network-observability-cli/releases/download/{{ .TagName }}/netobserv-cli-{{ .TagName }}-darwin-amd64.tar.gz" .TagName}}
    bin: netobserv
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://github.com/netobserv/network-observability-cli/releases/download/{{ .TagName }}/netobserv-cli-{{ .TagName }}-darwin-arm64.tar.gz" .TagName}}
    bin: netobserv
