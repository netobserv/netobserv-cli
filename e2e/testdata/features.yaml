apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netobserv-cli
  namespace: "netobserv-cli"
  labels:
    app: netobserv-cli
spec:
  selector:
    matchLabels:
      app: netobserv-cli
  template:
    metadata:
      labels:
        app: netobserv-cli
    spec:
      serviceAccountName: netobserv-cli
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: netobserv-cli
          image: "quay.io/netobserv/netobserv-ebpf-agent:main"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - "BPF"
                - "PERFMON"
                - "NET_ADMIN"
              drop:
                - ALL
            privileged: true
            readOnlyRootFilesystem: true
            runAsUser: 0
          env:
            - name: CACHE_ACTIVE_TIMEOUT
              value: "1s"
            - name: METRICS_ENABLE
              value: "false"
            - name: LOG_LEVEL
              value: debug
            - name: INTERFACES
              value: "eth0,eth1"
            - name: EXCLUDE_INTERFACES
              value: "lo"
            - name: PREFERRED_INTERFACE_FOR_MAC_PREFIX
              value: "0a:58=eth0"
            - name: SAMPLING
              value: "50"
            - name: ENABLE_RTT
              value: "true"
            - name: ENABLE_PKT_DROPS
              value: "true"
            - name: ENABLE_DNS_TRACKING
              value: "true"
            - name: ENABLE_NETWORK_EVENTS_MONITORING
              value: "true"
            - name: ENABLE_UDN_MAPPING
              value: "true"
            - name: ENABLE_PKT_TRANSLATION
              value: "true"
            - name: ENABLE_IPSEC_TRACKING
              value: "false"
            - name: FLOW_FILTER_RULES
              value: >-
                []
            - name: TC_ATTACH_MODE
              value: "any"
            - name: EXPORT
              value: "direct-flp"
            - name: FLP_CONFIG
              value: |-
                {
                  "log-level": "trace",
                  "metricsSettings": {
                    "disableGlobalServer": true
                  },
                  "parameters": [
                    {
                      "name": "enrich",
                      "transform": {
                        "type": "network",
                        "network": {
                          "rules": [
                            {
                              "type": "add_kubernetes",
                              "kubernetes": {
                                "add_zone": true,
                                "ipField": "SrcAddr",
                                "interfacesField": "Interfaces",
                                "udnsField": "Udns",
                                "macField": "SrcMac",
                                "output": "SrcK8S"
                              }
                            },
                            {
                              "type": "add_kubernetes",
                              "kubernetes": {
                                "add_zone": true,
                                "ipField": "DstAddr",
                                "interfacesField": "Interfaces",
                                "udnsField": "Udns",
                                "macField": "DstMac",
                                "output": "DstK8S"
                              }
                            },
                            {
                              "type": "reinterpret_direction"
                            }
                          ],
                          "directionInfo": {
                            "reporterIPField": "AgentIP",
                            "srcHostField": "SrcK8S_HostIP",
                            "dstHostField": "DstK8S_HostIP",
                            "flowDirectionField": "FlowDirection"
                          },
                          "kubeConfig": {
                            "secondaryNetworks": [
                              {
                                "name": "ovn-kubernetes",
                                "index": {
                                  "udn": null
                                }
                              }
                            ]
                          }
                        }
                      }
                    },
                    {
                      "name": "send",
                      "write": {
                        "type": "grpc",
                        "grpc": {
                          "targetHost": "collector.netobserv-cli.svc.cluster.local",
                          "targetPort": 9999
                        }
                      }
                    }
                  ],
                  "pipeline": [
                    {
                      "name": "enrich",
                      "follows": "preset-ingester"
                    },
                    {
                      "name": "send",
                      "follows": "enrich"
                    }
                  ]
                }
          volumeMounts:
            - name: bpf-kernel-debug
              mountPath: /sys/kernel/debug
              mountPropagation: HostToContainer
            - name: var-run-ovn
              mountPath: /var/run/ovn
              mountPropagation: HostToContainer
            - name: var-run-ovs
              mountPath: /var/run/openvswitch
              mountPropagation: HostToContainer
            - name: var-run-netns
              mountPath: /var/run/netns
              mountPropagation: HostToContainer
      volumes:
        - name: bpf-kernel-debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: var-run-ovn
          hostPath:
            path: /var/run/ovn-ic
            type: DirectoryOrCreate
        - name: var-run-ovs
          hostPath:
            path: /var/run/openvswitch
            type: DirectoryOrCreate
        - name: var-run-netns
          hostPath:
            path: /var/run/netns
            type: Directory
      nodeSelector:
        kubernetes.io/hostname: node1
