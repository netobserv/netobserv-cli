apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netobserv-cli
  namespace: "{{NAMESPACE}}"
  labels:
    app: netobserv-cli
spec:
  selector:
    matchLabels:
      app: netobserv-cli
  template:
    metadata:
      labels:
        app: netobserv-cli
    spec:
      serviceAccountName: netobserv-cli
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
      - operator: Exists
      containers:
      - name: netobserv-cli
        image: "{{AGENT_IMAGE_URL}}"
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - "BPF"
              - "PERFMON"
              - "NET_ADMIN"
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 0
        env:
          - name: CACHE_ACTIVE_TIMEOUT
            value: "1s"
          - name: METRICS_ENABLE
            value: "false"
          - name: LOG_LEVEL
            value: info
          - name: INTERFACES
            value: ""
          - name: EXCLUDE_INTERFACES
            value: "lo"
          - name: PREFERRED_INTERFACE_FOR_MAC_PREFIX
            value: "0a:58=eth0"
          - name: SAMPLING
            value: "1"
          - name: ENABLE_RTT
            value: "false"
          - name: ENABLE_PKT_DROPS
            value: "false"
          - name: ENABLE_DNS_TRACKING
            value: "false"
          - name: ENABLE_NETWORK_EVENTS_MONITORING
            value: "false"
          - name: ENABLE_UDN_MAPPING
            value: "false"
          - name: ENABLE_PKT_TRANSLATION
            value: "false"
          - name: ENABLE_IPSEC_TRACKING
            value: "false"
          - name: ENABLE_SECONDARY_NETWORKS
            value: "false"
          - name: FLOW_FILTER_RULES
            value: >-
              []
          - name: TC_ATTACH_MODE
            value: "any"
          - name: EXPORT
            value: "direct-flp"
          - name: FLP_CONFIG
            value: |
              {}
